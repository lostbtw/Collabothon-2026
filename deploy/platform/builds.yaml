apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: ordo-backend
  namespace: cfo-ai
  labels:
    app.kubernetes.io/part-of: ordo
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: ordo-backend
  namespace: cfo-ai
  labels:
    app.kubernetes.io/part-of: ordo
spec:
  runPolicy: Serial
  successfulBuildsHistoryLimit: 3
  failedBuildsHistoryLimit: 3
  source:
    type: Git
    git:
      uri: https://github.com/lostbtw/Collabothon-2026.git
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: deploy/images/backend.Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: ordo-backend:latest
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 4Gi
  triggers:
    - type: GitHub
      github:
        secretReference:
          name: github-webhook
