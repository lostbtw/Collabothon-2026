apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: cfo-ai
  labels:
    app.kubernetes.io/part-of: ordo
    app.kubernetes.io/name: grafana
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ordo-grafana-cluster-monitoring-view
  labels:
    app.kubernetes.io/part-of: ordo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: grafana
    namespace: cfo-ai
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-prometheus-token
  namespace: cfo-ai
  labels:
    app.kubernetes.io/part-of: ordo
  annotations:
    kubernetes.io/service-account.name: grafana
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: cfo-ai
  labels:
    app.kubernetes.io/part-of: ordo
    app.kubernetes.io/name: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus (cluster)
        uid: prometheus
        type: prometheus
        access: proxy
        url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
        isDefault: true
        editable: false
        jsonData:
          httpMethod: GET
          timeInterval: 30s
          tlsSkipVerify: true
          httpHeaderName1: Authorization
        secureJsonData:
          httpHeaderValue1: Bearer ${PROMETHEUS_TOKEN}
      - name: Ordo database
        uid: ordo-postgres
        type: grafana-postgresql-datasource
        url: postgresql.cfo-ai.svc.cluster.local:5432
        user: grafana_ro
        editable: false
        jsonData:
          database: ordo
          sslmode: disable
          postgresVersion: 1500
          timescaledb: false
          maxOpenConns: 5
          maxIdleConns: 2
        secureJsonData:
          password: ${GRAFANA_DB_PASSWORD}
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: ordo
        folder: Ordo
        type: file
        disableDeletion: true
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/dashboards
  plugins.yaml: |
    apiVersion: 1
    apps: []
  alerting.yaml: |
    apiVersion: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: cfo-ai
  labels:
    app.kubernetes.io/part-of: ordo
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: ordo
        app.kubernetes.io/name: grafana
    spec:
      serviceAccountName: grafana
      automountServiceAccountToken: false
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:12.4.14
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ordo-grafana
                  key: GF_SECURITY_ADMIN_PASSWORD
            - name: GRAFANA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ordo-grafana
                  key: GRAFANA_DB_PASSWORD
            - name: PROMETHEUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-prometheus-token
                  key: token
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /etc/grafana/dashboards/ordo-pipeline.json
            # Nothing leaves the cluster: no usage reports, update checks, news feed or plugin downloads.
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
            - name: GF_PLUGINS_PREINSTALL_DISABLED
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: provisioning
              mountPath: /etc/grafana/provisioning
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/dashboards
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
        - name: provisioning
          configMap:
            name: grafana-provisioning
            items:
              - key: datasources.yaml
                path: datasources/ordo.yaml
              - key: dashboards.yaml
                path: dashboards/ordo.yaml
              - key: plugins.yaml
                path: plugins/ordo.yaml
              - key: alerting.yaml
                path: alerting/ordo.yaml
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: cfo-ai
  labels:
    app.kubernetes.io/part-of: ordo
    app.kubernetes.io/name: grafana
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ordo-grafana
  namespace: cfo-ai
  labels:
    app.kubernetes.io/part-of: ordo
spec:
  to:
    kind: Service
    name: grafana
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
