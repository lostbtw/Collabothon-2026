apiVersion: v1
kind: ServiceAccount
metadata:
  name: cfo-app
  namespace: cfo-ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gpt-oss-20b-invoke
  namespace: cfo-ai
rules:
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    resourceNames: ["gpt-oss-20b"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cfo-app-gpt-oss-20b-invoke
  namespace: cfo-ai
subjects:
  - kind: ServiceAccount
    name: cfo-app
    namespace: cfo-ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gpt-oss-20b-invoke
---
apiVersion: v1
kind: Secret
metadata:
  name: llm-token
  namespace: cfo-ai
  annotations:
    kubernetes.io/service-account.name: cfo-app
type: kubernetes.io/service-account-token
