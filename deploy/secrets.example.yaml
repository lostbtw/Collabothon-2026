namespace: cfo-ai
secrets:
  llm-token:
    type: kubernetes.io/service-account-token
    serviceAccount: cfo-app
    keys: [token, service-ca.crt, ca.crt, namespace]
    create: oc apply -f deploy/models/llm-client.yaml
    usedBy: [backend, model-tests workbench]
  docling-api-key:
    type: Opaque
    keys: [DOCLING_SERVE_API_KEY]
    create: oc create secret generic docling-api-key -n cfo-ai --from-literal=DOCLING_SERVE_API_KEY=<random 32+ chars, never empty>
    usedBy: [docling-serve, backend/pipeline/extract, model-tests workbench]
  ordo-db:
    type: Opaque
    keys: [POSTGRESQL_USER, POSTGRESQL_PASSWORD, POSTGRESQL_DATABASE, ORDO_DATABASE_URL]
    create: deploy/platform/setup.sh secrets
    usedBy: [postgresql, backend, platform-check job]
  github-webhook:
    type: Opaque
    keys: [WebHookSecretKey]
    create: deploy/platform/setup.sh secrets
    usedBy: [buildconfigs ordo-backend, ordo-sim, ordo-web]
  sandbox-bank-token:
    type: Opaque
    keys: [BANK_TOKEN]
    create: deploy/platform/setup.sh secrets
    usedBy: [ordo-bank, ordo-api (simulated executor), ordo-connectors (bank connector)]
  ordo-mailbox:
    type: Opaque
    keys: [ORDO_IMAP_USER, ORDO_IMAP_PASSWORD]
    create: oc create secret generic ordo-mailbox -n cfo-ai --from-literal=ORDO_IMAP_USER=<invoices mailbox address> --from-literal=ORDO_IMAP_PASSWORD=<Gmail app password, not the account password>
    usedBy: [backend/connectors (ordo-connectors)]
  ordo-grafana:
    type: Opaque
    keys: [GF_SECURITY_ADMIN_PASSWORD, GRAFANA_DB_PASSWORD]
    create: deploy/platform/setup.sh secrets (or setup.sh grafana)
    usedBy: [grafana (admin login), database role grafana_ro (setup.sh grafana sets its password)]
  grafana-prometheus-token:
    type: kubernetes.io/service-account-token
    serviceAccount: grafana
    keys: [token, service-ca.crt, ca.crt, namespace]
    create: oc apply -f deploy/observability/grafana.yaml
    usedBy: [grafana (reads Thanos Querier as cluster-monitoring-view)]
  ordo-pgadmin:
    type: Opaque
    keys: [PGADMIN_DEFAULT_PASSWORD, PGADMIN_DB_PASSWORD]
    create: deploy/platform/setup.sh secrets (or setup.sh pgadmin)
    usedBy: [pgadmin (login admin@example.com), database role pgadmin_ro (setup.sh pgadmin sets its password; the pgadmin init container writes it to a .pgpass)]
