namespace: cfo-ai
secrets:
  llm-token:
    type: kubernetes.io/service-account-token
    serviceAccount: cfo-app
    keys: [token, service-ca.crt, ca.crt, namespace]
    create: oc apply -f deploy/models/llm-client.yaml
    usedBy: [backend, model-tests workbench]
  docling-api-key:
    type: Opaque
    keys: [DOCLING_SERVE_API_KEY]
    create: oc create secret generic docling-api-key -n cfo-ai --from-literal=DOCLING_SERVE_API_KEY=<random 32+ chars, never empty>
    usedBy: [docling-serve, backend/pipeline/extract, model-tests workbench]
