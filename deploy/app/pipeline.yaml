apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordo-pipeline
  namespace: cfo-ai
  labels:
    app.kubernetes.io/part-of: ordo
    app.kubernetes.io/name: ordo-pipeline
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"ordo-backend:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"pipeline\")].image"}]'
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ordo-pipeline
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: ordo
        app.kubernetes.io/name: ordo-pipeline
      annotations:
        alpha.image.policy.openshift.io/resolve-names: "*"
    spec:
      serviceAccountName: cfo-app
      containers:
        - name: pipeline
          image: ordo-backend:latest
          args: ["pipeline"]
          envFrom:
            - configMapRef:
                name: ordo-config
          env:
            - name: ORDO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ordo-db
                  key: ORDO_DATABASE_URL
            - name: LLM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-token
                  key: token
          volumeMounts:
            - name: raw
              mountPath: /data/raw
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: raw
          persistentVolumeClaim:
            claimName: ordo-raw
