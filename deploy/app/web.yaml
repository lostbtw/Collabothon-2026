apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordo-web
  namespace: cfo-ai
  labels:
    app.kubernetes.io/part-of: ordo
    app.kubernetes.io/name: ordo-web
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"ordo-web:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"web\")].image"}]'
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ordo-web
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: ordo
        app.kubernetes.io/name: ordo-web
      annotations:
        alpha.image.policy.openshift.io/resolve-names: "*"
    spec:
      containers:
        - name: web
          image: ordo-web:latest
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ordo-web
  namespace: cfo-ai
  labels:
    app.kubernetes.io/part-of: ordo
    app.kubernetes.io/name: ordo-web
spec:
  selector:
    app.kubernetes.io/name: ordo-web
  ports:
    - name: http
      port: 8080
      targetPort: http
