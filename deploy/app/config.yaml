apiVersion: v1
kind: ConfigMap
metadata:
  name: ordo-config
  namespace: cfo-ai
  labels:
    app.kubernetes.io/part-of: ordo
data:
  LLM_BASE_URL: https://gpt-oss-20b-predictor.cfo-ai.svc.cluster.local:8443/v1
  LLM_MODEL: gpt-oss-20b
  ORDO_DOCLING_URL: http://docling-serve.cfo-ai.svc.cluster.local:5001
  ORDO_BANK_URL: http://ordo-bank.cfo-ai.svc.cluster.local:8081
  ORDO_SSE_REPLAY_FIXTURES: "0"
  MLFLOW_TRACKING_URI: https://mlflow.redhat-ods-applications.svc:8443/mlflow
  MLFLOW_WORKSPACE: cfo-ai
  MLFLOW_TRACKING_SERVER_CERT_PATH: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
