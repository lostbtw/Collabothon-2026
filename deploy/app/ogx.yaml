# OGX server (OpenShift AI) in front of the model: it runs the agents' tool loop and calls Ordo's tools over MCP.
# Needs the OGX Operator (DataScienceCluster spec.components.ogx = Managed, llamastackoperator = Removed), the
# database "ogx" and ordo-mcp (deploy/app/mcp.yaml);
# `deploy/platform/setup.sh ogx` does both, applies this file and switches the agents over.
apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  name: ordo-ogx
  namespace: cfo-ai
  labels:
    app.kubernetes.io/part-of: ordo
spec:
  distribution:
    name: rh
  workload:
    replicas: 1
    storage:
      size: 5Gi
    overrides:
      env:
        # The model, through ordo-mcp's pass-through: OGX sends a tool's result as text parts, which the gpt-oss chat
        # handler of our vLLM refuses; the pass-through makes it plain text (backend/agents/model_passthrough.py).
        - name: VLLM_URL
          value: http://ordo-mcp.cfo-ai.svc.cluster.local:8000/model/v1
        - name: INFERENCE_MODEL
          value: gpt-oss-20b
        - name: VLLM_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: llm-token
              key: token
        - name: POSTGRES_HOST
          value: postgresql.cfo-ai.svc.cluster.local
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: ogx
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: ordo-db
              key: POSTGRESQL_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ordo-db
              key: POSTGRESQL_PASSWORD
