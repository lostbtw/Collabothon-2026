# Needs the OGX Operator, the database "ogx" and ordo-mcp; `deploy/platform/setup.sh ogx` sets them up and applies this.
apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  name: ordo-ogx
  namespace: cfo-ai
  labels:
    app.kubernetes.io/part-of: ordo
spec:
  distribution:
    name: rh
  workload:
    replicas: 1
    storage:
      size: 5Gi
    overrides:
      env:
        # Through ordo-mcp's pass-through: our vLLM's gpt-oss handler refuses tool results made of text parts.
        - name: VLLM_URL
          value: http://ordo-mcp.cfo-ai.svc.cluster.local:8000/model/v1
        - name: INFERENCE_MODEL
          value: gpt-oss-20b
        - name: VLLM_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: llm-token
              key: token
        - name: POSTGRES_HOST
          value: postgresql.cfo-ai.svc.cluster.local
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: ogx
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: ordo-db
              key: POSTGRESQL_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ordo-db
              key: POSTGRESQL_PASSWORD
