openapi: 3.1.0
info:
  title: Ordo backend API (Autonomous CFO, Collabothon 2026)
  version: 0.1.0
  description: |
    One API used by the frontend, the chat agent (as tools / MCP), and the simulators.
    Entity shapes live in ./schemas/*.schema.json (JSON Schema 2020-12) and are referenced from here.
    Conventions:
      * All ids are opaque strings with a prefix (doc_, txn_, rec_ ...).
      * Money = {amount: "decimal string", currency: "ISO"}; negative = money out.
      * Lists return {items: [...], next_cursor: string|null}. Pass ?cursor= to continue.
      * Single-tenant demo: company is chosen with ?company_id= (default: the first company). No auth in the hackathon build.
      * Every write that represents an owner decision creates an Approval record (audit trail).
servers:
  - url: /api/v1
tags:
  - {name: sources, description: "Connectors and sync status (role 2)"}
  - {name: documents, description: "Extracted documents and the approval inbox (role 3)"}
  - {name: bank, description: "Accounts and bank lines (roles 2 and 3)"}
  - {name: ledger, description: "Owner-approved ledger (role 4)"}
  - {name: forecast, description: "Liquidity forecast (role 4)"}
  - {name: recommendations, description: "Agent output and approvals (role 5)"}
  - {name: chat, description: "Embedded chat (role 5)"}
  - {name: owner, description: "Settings, people, rules and the owner's money views (role 6 screens)"}
  - {name: stream, description: "Live UI updates"}
paths:
  /health:
    get:
      summary: Liveness + which model endpoint is in use
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [ok]}
                  llm: {type: object, properties: {base_url: {type: string}, model: {type: string}, reachable: {type: boolean}}}
                  speech: {type: [object, 'null'], description: "Speech to text for the chat's voice input; null when Whisper is not deployed", properties: {model: {type: string}, reachable: {type: boolean}}}
                  demo_clock: {type: string, format: date-time, description: "Simulated 'now' used by generator and forecast"}
  /companies:
    get:
      summary: Demo companies (Borsuk Labs = messy data; Pizzeria Amalfi = organisers' data)
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object, properties: {id: {type: string}, name: {type: string}, base_currency: {type: string}, country: {type: string}, as_of_date: {type: string, format: date, description: "Day the company is seen on: forecasts use only transactions booked up to it (D-21). co_borsuk 2026-11-21, co_amalfi 2025-05-15"}}}}}}}}}
  /sources:
    get:
      tags: [sources]
      summary: All connected sources with last-synced status
      parameters: [{$ref: '#/components/parameters/company'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/SourceList'}}}}
  /sources/{id}/sync:
    post:
      tags: [sources]
      summary: Trigger a sync now (manual trigger of the same code path the scheduler runs)
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '202': {description: Started, content: {application/json: {schema: {$ref: './schemas/sync_run.schema.json'}}}}
        '409': {description: A run is already in progress}
  /sync-runs:
    get:
      tags: [sources]
      summary: History of connector runs (newest first)
      parameters:
        - {name: source_id, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 20}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: './schemas/sync_run.schema.json'}}}}}}}
  /raw-items/{id}:
    get:
      tags: [sources]
      summary: Raw item metadata (evidence trail)
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './schemas/raw_item.schema.json'}}}}
  /raw-items/{id}/content:
    get:
      tags: [sources]
      summary: Original bytes (image, PDF, XML, .eml) for the document viewer
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '200': {description: Binary content with the stored content type}
  /uploads:
    post:
      tags: [sources]
      summary: FALLBACK ONLY - manual file upload; creates a RawItem with kind=upload and runs the normal pipeline
      requestBody:
        content:
          multipart/form-data:
            schema: {type: object, properties: {file: {type: string, format: binary}, submitted_by: {type: string}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: './schemas/raw_item.schema.json'}}}}
  /documents:
    get:
      tags: [documents]
      summary: List documents
      parameters:
        - {$ref: '#/components/parameters/company'}
        - {name: status, in: query, schema: {type: string, enum: [extracted, needs_review, approved, rejected, duplicate]}}
        - {name: flag, in: query, schema: {type: string}}
        - {name: direction, in: query, schema: {type: string, enum: [purchase, sale]}}
        - {name: q, in: query, schema: {type: string}, description: "Free text over seller and number"}
        - {$ref: '#/components/parameters/cursor'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: './schemas/document.schema.json'}}, next_cursor: {type: [string, 'null']}}}}}}
  /documents/{id}:
    get:
      tags: [documents]
      summary: One document incl. extraction confidence, flags, duplicates and its matches
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: {$ref: './schemas/document.schema.json'}
                  duplicates: {type: array, items: {$ref: './schemas/document.schema.json'}}
                  matches: {type: array, items: {$ref: './schemas/match.schema.json'}}
    patch:
      tags: [documents]
      summary: Owner corrects extracted fields (stored as an Approval with changes; re-runs matching)
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody:
        content: {application/json: {schema: {type: object, description: "Partial Document: only totals, dates, seller, buyer and category_suggestion.category"}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: './schemas/document.schema.json'}}}}
  /accounts:
    get:
      tags: [bank]
      summary: Accounts and cards with current balances
      parameters: [{$ref: '#/components/parameters/company'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: './schemas/account.schema.json'}}, total_liquidity_base: {$ref: './schemas/common.schema.json#/$defs/Money'}}}}}}
  /transactions:
    get:
      tags: [bank]
      summary: Bank lines
      parameters:
        - {$ref: '#/components/parameters/company'}
        - {name: account_id, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: match_status, in: query, schema: {type: string, enum: [unmatched, suggested, matched, no_document_needed, missing_document]}}
        - {name: series, in: query, schema: {type: string}, description: recurring_series_id}
        - {$ref: '#/components/parameters/cursor'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: './schemas/transaction.schema.json'}}, next_cursor: {type: [string, 'null']}}}}}}
  /transactions/{id}:
    get:
      tags: [bank]
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './schemas/transaction.schema.json'}}}}
    patch:
      tags: [bank]
      summary: The owner changes a bank line's category; remembered as a rule for its counterparty (see /rules)
      parameters: [{$ref: '#/components/parameters/id'}, {$ref: '#/components/parameters/company'}]
      requestBody: {content: {application/json: {schema: {type: object, required: [category], properties: {category: {$ref: './schemas/common.schema.json#/$defs/Category'}}}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './schemas/transaction.schema.json'}}}}
  /counterparties:
    get:
      tags: [bank]
      parameters: [{$ref: '#/components/parameters/company'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: './schemas/counterparty.schema.json'}}}}}}}
  /matches:
    get:
      tags: [documents]
      summary: Match proposals
      parameters:
        - {$ref: '#/components/parameters/company'}
        - {name: status, in: query, schema: {type: string, enum: [suggested, auto_confirmed, confirmed, rejected]}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: './schemas/match.schema.json'}}}}}}}
  /matches/{id}/decision:
    post:
      tags: [documents]
      summary: Owner confirms or rejects a match (creates Approval; on confirm proposes/approves ledger entries)
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Decision'}}}}
      responses:
        '200': {description: Decision recorded, content: {application/json: {schema: {$ref: './schemas/approval.schema.json'}}}}
  /inbox:
    get:
      tags: [recommendations]
      summary: The owner's to-do - what waits for a decision, then single pieces of advice, most urgent first
      description: Convenience view = recommendations with status new/seen and control_level approval_required (first) or recommendation, except the bulk advice kinds mark_private and missing_document; plus counts for the dashboard badge.
      parameters: [{$ref: '#/components/parameters/company'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: './schemas/recommendation.schema.json'}}
                  counts: {type: object, properties: {approval_required: {type: integer}, recommendation: {type: integer}, analysed_autonomously_today: {type: integer}}}
  /ledger:
    get:
      tags: [ledger]
      summary: Ledger entries
      parameters:
        - {$ref: '#/components/parameters/company'}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: category, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [proposed, approved, void]}}
        - {name: paid_by, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/cursor'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: './schemas/ledger_entry.schema.json'}}, next_cursor: {type: [string, 'null']}}}}}}
  /ledger/summary:
    get:
      tags: [ledger]
      summary: Aggregates for dashboard tiles and month-over-month insights (pure SQL, no LLM)
      parameters:
        - {$ref: '#/components/parameters/company'}
        - {name: group_by, in: query, schema: {type: string, enum: [category, month, cost_behaviour, paid_by, counterparty]}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: basis, in: query, description: 'ledger (default) or bank: sum the bank lines per category, for months not booked yet (group_by category only)', schema: {type: string, enum: [ledger, bank]}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows: {type: array, items: {type: object, properties: {key: {type: string}, amount_base: {$ref: './schemas/common.schema.json#/$defs/Money'}, previous_period: {$ref: './schemas/common.schema.json#/$defs/Money'}, change_pct: {type: [number, 'null']}, entries: {type: integer}}}}
                  kpis: {type: object, properties: {reimbursements_owed: {$ref: './schemas/common.schema.json#/$defs/Money'}, vat_lost_ytd: {$ref: './schemas/common.schema.json#/$defs/Money'}, documents_missing: {type: integer}, tax_due_next_30d: {$ref: './schemas/common.schema.json#/$defs/Money'}}}
  /ledger/export:
    get:
      tags: [ledger]
      summary: Export everything as CSV (zip) - "what if the platform is down"
      parameters: [{$ref: '#/components/parameters/company'}]
      responses:
        '200': {description: application/zip}
  /forecast/latest:
    get:
      tags: [forecast]
      summary: Latest forecast for the company
      parameters:
        - {$ref: '#/components/parameters/company'}
        - {name: horizon_days, in: query, schema: {type: integer, default: 45}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './schemas/forecast.schema.json'}}}}
  /forecast/{id}:
    get:
      tags: [forecast]
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './schemas/forecast.schema.json'}}}}
  /forecast/recompute:
    post:
      tags: [forecast]
      summary: Recompute now (also runs automatically after ledger/transaction changes)
      parameters: [{$ref: '#/components/parameters/company'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './schemas/forecast.schema.json'}}}}
  /forecast/events:
    post:
      tags: [forecast]
      summary: Owner tells the system about a future event ("we are closed 1-30 June", "client X will pay on 15 Dec")
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [label, date_from, date_to, effect]
              properties:
                label: {type: string}
                date_from: {type: string, format: date}
                date_to: {type: string, format: date}
                effect: {type: string, enum: [no_variable_flows, no_revenue, extra_inflow, extra_outflow]}
                amount: {$ref: './schemas/common.schema.json#/$defs/Money'}
                source: {type: string, enum: [owner_chat, owner_form]}
      responses:
        '201': {description: Event stored and forecast recomputed, content: {application/json: {schema: {$ref: './schemas/forecast.schema.json'}}}}
  /forecast/scenario:
    post:
      tags: [forecast]
      summary: What-if - recompute with one hypothetical action or delay, without saving it as the main forecast
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                credit_line: {type: object, properties: {limit: {$ref: './schemas/common.schema.json#/$defs/Money'}, from: {type: string, format: date}}}
                shift_receivable: {type: object, properties: {document_id: {type: string}, new_date: {type: string, format: date}}}
                shift_payable: {type: object, properties: {component_id: {type: string}, days: {type: integer}}}
      responses:
        '200': {description: Scenario forecast (scenario_of set), content: {application/json: {schema: {$ref: './schemas/forecast.schema.json'}}}}
  /recommendations:
    get:
      tags: [recommendations]
      parameters:
        - {$ref: '#/components/parameters/company'}
        - {name: status, in: query, schema: {type: string}}
        - {name: agent, in: query, schema: {type: string, enum: [ingestion, liquidity, tax, fx, chat]}}
        - {name: control_level, in: query, schema: {type: string, enum: [analysed_autonomously, recommendation, approval_required]}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: './schemas/recommendation.schema.json'}}}}}}}
  /recommendations/{id}:
    get:
      tags: [recommendations]
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './schemas/recommendation.schema.json'}}}}
  /recommendations/{id}/decision:
    post:
      tags: [recommendations]
      summary: Owner approves / rejects. On approve the action runs in SIMULATED mode and the result is returned.
      description: |
        State machine: new -> seen -> approved -> executed_simulated | rejected | expired | superseded.
        Server rejects (409) a decision on a recommendation whose control_level is not approval_required,
        and any attempt to execute with execution_mode=permitted (not enabled in this build).
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Decision'}}}}
      responses:
        '200': {description: Decision recorded (and simulated execution result), content: {application/json: {schema: {$ref: './schemas/approval.schema.json'}}}}
        '409': {description: Not decidable in current state}
  /approvals:
    get:
      tags: [recommendations]
      summary: Audit trail of all owner decisions
      parameters: [{$ref: '#/components/parameters/company'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: './schemas/approval.schema.json'}}}}}}}
  /activity:
    get:
      tags: [recommendations]
      summary: '"What the agents did on their own" feed (control_level = analysed_autonomously), built from events'
      parameters: [{$ref: '#/components/parameters/company'}, {name: since, in: query, schema: {type: string, format: date-time}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object, properties: {at: {type: string, format: date-time}, agent: {type: string}, text: {type: string}, subject: {type: object, description: "What the action touched. Undo of an auto-confirmed match = reject it via /matches/{id}/decision", properties: {type: {type: string}, id: {type: string}}}, evidence: {type: array, items: {$ref: './schemas/common.schema.json#/$defs/EvidenceLink'}}}}}}}}}}
  /chat:
    post:
      tags: [chat]
      summary: Ask a question in natural language. The answer always carries evidence (rows, SQL, forecast components).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                session_id: {type: [string, 'null']}
                company_id: {type: string}
                message: {type: string}
                language: {type: string, enum: [en, pl, de], default: en}
      responses:
        '200':
          description: Answer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatAnswer'}
  /chat/transcribe:
    post:
      tags: [chat]
      summary: Speech to text for the chat's voice input (Whisper on the cluster). The text goes back to the message box for the owner to check and send; neither audio nor text is stored, logged or traced.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary, description: "Recorded audio (audio/webm, audio/mp4, audio/ogg, audio/wav), at most 5 MB"}
                language: {type: string, enum: [pl, en, ru], description: "Optional; without it Whisper detects the language"}
      responses:
        '200': {description: Transcript, content: {application/json: {schema: {$ref: '#/components/schemas/Transcript'}}}}
        '413': {description: The file is over 5 MB (too_large), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '415': {description: The file is not audio (unsupported_media_type), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: A language given other than pl, en, ru, or an empty file (invalid_request), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: Whisper is not deployed or does not answer (speech_unavailable), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /fx/rates:
    get:
      summary: Exchange rate lookup used by engine and UI tooltips
      parameters:
        - {name: currency, in: query, required: true, schema: {type: string}}
        - {name: date, in: query, required: true, schema: {type: string, format: date}}
        - {name: rule, in: query, schema: {type: string, enum: [pl_tax_prev_business_day, booking_day], default: pl_tax_prev_business_day}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './schemas/common.schema.json#/$defs/FxConversion'}}}}
  /fx/exposure:
    get:
      summary: FX Shield - open foreign-currency exposure per invoice with historical-scenario downside (method in the role 4 spec issue)
      parameters: [{$ref: '#/components/parameters/company'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        document_id: {type: string}
                        direction: {type: string, enum: [receivable, payable]}
                        amount: {$ref: './schemas/common.schema.json#/$defs/Money'}
                        value_today_base: {$ref: './schemas/common.schema.json#/$defs/Money'}
                        expected_cash_date: {type: string, format: date}
                        horizon_days: {type: integer}
                        scenarios: {type: integer}
                        bad_case_p95: {$ref: './schemas/common.schema.json#/$defs/Money'}
                        expected_shortfall: {$ref: './schemas/common.schema.json#/$defs/Money'}
                        deal_profit: {$ref: './schemas/common.schema.json#/$defs/Money'}
                        profit_source: {type: string, enum: [owner, average_margin, loss_limit]}
                        verdict: {type: string, enum: [hedge_proposed, not_worth_it, naturally_hedged, hedged]}
                        recommendation_id: {type: [string, 'null']}
  /settings:
    get:
      tags: [owner]
      summary: Company details and alert settings the owner keeps in Settings
      parameters: [{$ref: '#/components/parameters/company'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Settings'}}}}
    patch:
      tags: [owner]
      summary: Change company details or alerts (only the fields sent)
      parameters: [{$ref: '#/components/parameters/company'}]
      requestBody: {content: {application/json: {schema: {type: object, properties: {company: {type: object}, alerts: {type: object}}}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Settings'}}}}
  /people:
    get:
      tags: [owner]
      summary: The people of the company, with the cards and bank-statement names that tie payments to them
      parameters: [{$ref: '#/components/parameters/company'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Person'}}}}}}}
    post:
      tags: [owner]
      summary: Add a person
      parameters: [{$ref: '#/components/parameters/company'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Person'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Person'}}}}
  /people/costs:
    get:
      tags: [owner]
      summary: What each person cost in a month (bank lines that pay them) and what the company owes them for receipts
      parameters: [{$ref: '#/components/parameters/company'}, {name: month, in: query, description: YYYY-MM (default the last full month), schema: {type: string}}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {type: object, required: [person_id, name, role, paid, owed], properties: {person_id: {type: string}, name: {type: string}, role: {type: string}, pay_type: {type: [string, 'null']}, paid: {$ref: './schemas/common.schema.json#/$defs/Money'}, payments: {type: integer}, owed: {$ref: './schemas/common.schema.json#/$defs/Money'}, receipts_owed: {type: integer}, parts: {type: array, items: {type: object, properties: {label: {type: string}, amount: {$ref: './schemas/common.schema.json#/$defs/Money'}}}}}}}
                  totals: {type: object, properties: {staff: {$ref: './schemas/common.schema.json#/$defs/Money'}, social_security: {$ref: './schemas/common.schema.json#/$defs/Money'}, share_of_costs: {type: number}}}
  /clients:
    get:
      tags: [owner]
      summary: Clients - what each paid in the month and which invoices are still open, how late, and how late they usually pay
      parameters: [{$ref: '#/components/parameters/company'}, {name: month, in: query, schema: {type: string}}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {type: object, required: [counterparty_id, name, paid_in_month, open_invoices, open_total_base], properties: {counterparty_id: {type: string}, name: {type: string}, currency: {type: string}, paid_in_month: {$ref: './schemas/common.schema.json#/$defs/Money'}, open_invoices: {type: array, items: {type: object, properties: {document_id: {type: string}, number: {type: [string, 'null']}, gross: {$ref: './schemas/common.schema.json#/$defs/Money'}, gross_base: {$ref: './schemas/common.schema.json#/$defs/Money'}, due_date: {type: [string, 'null']}, days_late: {type: integer}}}}, open_total_base: {$ref: './schemas/common.schema.json#/$defs/Money'}, typical_payment_delay_days: {type: [integer, 'null']}, share_of_income: {type: number}}}}
                  totals: {type: object, properties: {paid_in_month: {$ref: './schemas/common.schema.json#/$defs/Money'}, open_base: {$ref: './schemas/common.schema.json#/$defs/Money'}, late_base: {$ref: './schemas/common.schema.json#/$defs/Money'}}}
  /subscriptions:
    get:
      tags: [owner]
      summary: What is paid every month (scope=all) or only tools and services (default), seen from a month, with price rises, double payments and private cards
      parameters: [{$ref: '#/components/parameters/company'}, {name: month, in: query, schema: {type: string}}, {name: scope, in: query, schema: {type: string, enum: [subscriptions, all]}}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {type: object, required: [counterparty_id, name, category, monthly, paid_by, flags], properties: {counterparty_id: {type: string}, name: {type: string}, category: {type: string}, monthly: {$ref: './schemas/common.schema.json#/$defs/Money'}, paid_in_month: {type: boolean}, previous_monthly: {$ref: './schemas/common.schema.json#/$defs/Money'}, original: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/Money'}, {type: 'null'}]}, duplicate_cost: {$ref: './schemas/common.schema.json#/$defs/Money'}, paid_by: {type: array, items: {type: object, properties: {kind: {type: string, enum: [account, card, person]}, label: {type: string}}}}, flags: {type: array, items: {type: string, enum: [price_up, paid_twice, paid_privately]}}, series_ids: {type: array, items: {type: string}}}}}
                  monthly_total: {$ref: './schemas/common.schema.json#/$defs/Money'}
  /rules:
    get:
      tags: [owner]
      summary: Rules Ordo learned when the owner changed a type
      parameters: [{$ref: '#/components/parameters/company'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object, properties: {id: {type: string}, raw: {type: string}, counterparty_id: {type: [string, 'null']}, counterparty_name: {type: string}, category: {type: string}, learned_at: {type: string, format: date-time}}}}}}}}}
  /rules/{id}:
    delete:
      tags: [owner]
      summary: Forget a learned rule
      parameters: [{$ref: '#/components/parameters/id'}, {$ref: '#/components/parameters/company'}]
      responses:
        '204': {description: Deleted}
  /chat/sessions:
    get:
      tags: [chat]
      summary: Past chats of the company, newest first
      parameters: [{$ref: '#/components/parameters/company'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object, properties: {session_id: {type: string}, title: {type: string}, last_at: {type: string, format: date-time}, messages: {type: integer}}}}}}}}}
  /chat/sessions/{id}:
    get:
      tags: [chat]
      summary: The messages of one past chat
      parameters: [{$ref: '#/components/parameters/id'}, {$ref: '#/components/parameters/company'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {session_id: {type: string}, messages: {type: array, items: {type: object, properties: {role: {type: string, enum: [user, assistant]}, content: {type: string}, at: {type: string, format: date-time}}}}}}}}}
  /balance/history:
    get:
      tags: [bank]
      summary: Cash in the company's accounts at the end of each day before the as-of date (only days that change)
      parameters: [{$ref: '#/components/parameters/company'}, {name: days, in: query, schema: {type: integer, default: 91}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {currency: {type: string}, points: {type: array, items: {type: object, properties: {date: {type: string, format: date}, balance: {type: string}}}}}}}}}
  /events/stream:
    get:
      tags: [stream]
      summary: Server-Sent Events. Each message's data is an Event envelope (schemas/event.schema.json).
      parameters: [{$ref: '#/components/parameters/company'}]
      responses:
        '200': {description: text/event-stream}
components:
  parameters:
    id: {name: id, in: path, required: true, schema: {type: string}}
    company: {name: company_id, in: query, schema: {type: string}}
    cursor: {name: cursor, in: query, schema: {type: string}}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: object, required: [code, message], properties: {code: {type: string}, message: {type: string}}}
    Transcript:
      type: object
      required: [text, language, duration_seconds, model, seconds]
      properties:
        text: {type: string, description: "What Whisper heard; empty when nothing was said"}
        language: {type: string, description: "ISO 639-1 code of the language heard: the one given, else the one Whisper detected"}
        duration_seconds: {type: number, description: "Length of the recording"}
        model: {type: string}
        seconds: {type: number, description: "Time the transcription took"}
    Settings:
      type: object
      properties:
        company: {type: object, properties: {id: {type: string}, name: {type: string}, tax_id: {type: [string, 'null']}, base_currency: {type: string}, vat_period: {type: string, enum: [monthly, quarterly]}, accountant_email: {type: [string, 'null']}}}
        alerts: {type: object, properties: {safety_buffer: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/Money'}, {type: 'null'}]}, late_client_days: {type: integer}, weekly_summary: {type: boolean}}}
    Person:
      type: object
      required: [name, email, role]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string}
        role: {type: string, enum: [owner, employee, contractor]}
        pay_type: {type: [string, 'null']}
        card_last4: {type: array, items: {type: string}}
        statement_names: {type: array, items: {type: string}}
        tax_id: {type: [string, 'null']}
        iban: {type: [string, 'null']}
    SourceList:
      type: object
      properties:
        items: {type: array, items: {$ref: './schemas/source.schema.json'}}
    Decision:
      type: object
      required: [decision]
      properties:
        decision: {type: string, enum: [approved, rejected, approved_with_changes]}
        comment: {type: [string, 'null']}
        changes: {type: [object, 'null'], description: "Field overrides keyed by dotted path, for example proposed_action.params.limit set to a Money object"}
        channel: {type: string, enum: [dashboard, chat], default: dashboard}
    ChatAnswer:
      type: object
      required: [session_id, answer, evidence]
      properties:
        session_id: {type: string}
        answer: {type: string, description: "Plain-language answer. Numbers are copied from tool results and never generated."}
        evidence: {type: array, items: {$ref: './schemas/common.schema.json#/$defs/EvidenceLink'}}
        table: {type: [object, 'null'], properties: {columns: {type: array, items: {type: string}}, rows: {type: array, items: {type: array}}, sql: {type: string}}}
        tool_calls: {type: array, items: {type: object, properties: {tool: {type: string}, arguments: {type: object}, duration_ms: {type: integer}}}}
        created_recommendation_id: {type: [string, 'null'], description: "Chat can only PROPOSE actions; they land in the inbox as recommendations"}
        guardrail: {type: [object, 'null'], properties: {blocked: {type: boolean}, reason: {type: string}}}
        trace_id: {type: [string, 'null']}
        suggested_questions: {type: array, items: {type: string}, description: "Questions for the suggested-question buttons"}
