# Static hosting for the built app (dist/). Unknown paths fall back to index.html
# because the app uses clean URLs (client-side routing).
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # API calls go to the backend service; the upstream is set at deploy time.
  # location /api/ { proxy_pass http://ordo-api:8000; proxy_buffering off; }
}
