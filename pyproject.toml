[project]
name = "ordo-backend"
version = "0.1.0"
description = "Ordo backend: API, connectors, pipeline, finance engine and agents (one package, four entrypoints)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "openai>=1.50",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "pyyaml>=6",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.26",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pytest>=8",
]
localdb = [
    "pgserver>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend"]
addopts = "-q --import-mode=importlib"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
