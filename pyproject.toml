[project]
name = "ordo-backend"
version = "0.1.0"
description = "Ordo backend: API, connectors, pipeline, finance engine and agents (one package, four entrypoints)"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend"]
addopts = "-q"
